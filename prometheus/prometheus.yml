global:	
  scrape_interval: 15s
  evaluation_interval: 10s

rule_files:
  - alert.rules.yml

scrape_configs:
  - job_name: 'nestjs'

    static_configs:
      - targets:
          - app1:3003
          - app2:3003
  - job_name: 'node'
    static_configs:
      - targets:
          - node-exporter:9100
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093
